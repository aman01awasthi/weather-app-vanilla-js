<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #4e73df, #1cc88a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .weather-card {
      width: 100%;
      max-width: 555px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      padding: 2rem;
      color: #fff;
    }

    .form-control {
      border-radius: 12px;
      padding: 12px;
      border: none;
    }

    .form-control:focus {
      box-shadow: 0 0 0 3px rgba(255,255,255,0.4);
    }

    .btn {
      border-radius: 12px;
      padding: 10px;
      font-weight: 500;
    }

    .weather-data {
      margin-top: 20px;
      text-align: center;
    }

    .loader {
      display: none;
      margin-top: 20px;
      text-align: center;
    }

    .spinner-border {
      width: 3rem;
      height: 3rem;
    }

    #displayError{
        color: red;
    }

    li{
      list-style-type: none;
    }
  </style>
</head>

<body>
  <div class="weather-card text-center">
    <h3 class="mb-4 fw-semibold">Weather App</h3>

    <form id="weatherForm">
      <div class="mb-3 text-start">
        <label for="city" class="form-label">Enter City Name</label>
        <input type="text" id="city" class="form-control" placeholder="e.g. Dubai">
        <p id="displayError"></p>
      </div>

      <button class="btn btn-light w-100" type="submit">Search</button>
    </form>

    <div class="weather-data" id="weather-container"></div>

    <div class="loader" id="loader-container">
      <div class="spinner-border text-light" role="status"></div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
